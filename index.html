<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Record Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>Student Record Management System</h1>
      
    </header>

    <div class="grid">
     
      <div>
        <!-- Feedback Alert Banner -->
        <div id="feedbackAlert" class="alert hidden">
          <span id="alertIcon"></span>
          <span id="alertMessage"></span>
          <button class="alert-close" onclick="hideFeedback()">&times;</button>
        </div>

        <div class="card">
          <h2 id="formTitle">Add New Student</h2>
          <form id="studentForm" novalidate>
            <div class="form-group">
              <label for="studentId">Student ID <span class="required">*</span></label>
              <input type="text" id="studentId" placeholder="e.g. 2026-0001" required>
              <small class="error-msg" id="idError"></small>
            </div>
            
            <div class="form-group">
              <label for="fullName">Full Name <span class="required">*</span></label>
              <input type="text" id="fullName" placeholder="e.g. Juan Cruz" required>
              <small class="error-msg" id="nameError"></small>
            </div>

            <div class="form-group">
              <label for="program">Academic Program <span class="required">*</span></label>
              <select id="program" required>
                <option value="">Select Program...</option>
                <option value="BS Information Technology">BS Information Technology</option>
                <option value="BS Computer Science">BS Computer Science</option>
                <option value="BS Information Systems">BS Information Systems</option>
              </select>
              <small class="error-msg" id="programError"></small>
            </div>

            <div class="btn-group">
              <button type="submit" id="submitBtn" class="btn-primary">Submit Record</button>
              <button type="button" id="cancelBtn" class="btn-secondary" style="display:none;">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      
      <div>
        <div class="card">
          <div class="table-header">
            <h2>Database Records (SELECT)</h2>
            <label class="checkbox-label">
              <input type="checkbox" id="showArchived"> Show Archived Records
            </label>
          </div>

          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Full Name</th>
                  <th>Program</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="studentTableBody">
                <!-- Dynamically populated by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  
  <script src="js/database.js"></script>
  <script src="js/controller.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
